 serif" font-size="20" text-anchor="middle" dominant-baseline="middle" x="787.5" y="720.0" fill="black">保存驳回状态及原因</text><rect x="670" y="945" width="235" height="70" fill="white" stroke="black" stroke-width="1.3" /><text font-family="SimSun, Songti SC, serif" font-size="20" text-anchor="middle" dominant-baseline="middle" x="787.5" y="967.5" fill="black">提示冲突或记录已变化</text><text font-family="SimSun, Songti SC, serif" font-size="20" text-anchor="middle" dominant-baseline="middle" x="787.5" y="992.5" fill="black">不覆盖其他人的更新</text><text font-family="SimSun, Songti SC, serif" font-size="22" text-anchor="middle" dominant-baseline="middle" x="470.0" y="1266.0" fill="black">图3-5  实验室预约审批流程图</text><text font-family="SimSun, serif" font-size="18" text-anchor="middle" dominant-baseline="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round" x="440" y="420" fill="black">是</text><text font-family="SimSun, serif" font-size="18" text-anchor="middle" dominant-baseline="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round" x="600" y="345" fill="black">否</text><text font-family="SimSun, serif" font-size="18" text-anchor="middle" dominant-baseline="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round" x="440" y="790" fill="black">是</text><text font-family="SimSun, serif" font-size="18" text-anchor="middle" dominant-baseline="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round" x="600" y="710" fill="black">否</text><text font-family="SimSun, serif" font-size="18" text-anchor="middle" dominant-baseline="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round" x="440" y="1040" fill="black">是</text><text font-family="SimSun, serif" font-size="18" text-anchor="middle" dominant-baseline="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round" x="600" y="965" fill="black">否</text></svg>