gti SC, serif" font-size="20" text-anchor="middle" dominant-baseline="middle" x="920.0" y="712.0" fill="black">保存资产事件记录</text><rect x="280" y="855" width="500" height="76" fill="white" stroke="black" stroke-width="1.3" /><text font-family="SimSun, Songti SC, serif" font-size="20" text-anchor="middle" dominant-baseline="middle" x="530.0" y="880.5" fill="black">刷新资产列表并反馈操作结果</text><text font-family="SimSun, Songti SC, serif" font-size="20" text-anchor="middle" dominant-baseline="middle" x="530.0" y="905.5" fill="black">运行指标由客户端心跳上报</text><ellipse cx="530.0" cy="1012.0" rx="70.0" ry="22.0" fill="white" stroke="black" stroke-width="1.3" /><text font-family="SimSun, Songti SC, serif" font-size="20" text-anchor="middle" dominant-baseline="middle" x="530.0" y="1012.0" fill="black">结束</text><text font-family="SimSun, Songti SC, serif" font-size="22" text-anchor="middle" dominant-baseline="middle" x="530.0" y="1076.0" fill="black">图3-6  设备资产管理流程图</text><text font-family="SimSun, serif" font-size="18" text-anchor="middle" dominant-baseline="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round" x="140" y="455" fill="black">新增 / 编辑</text><text font-family="SimSun, serif" font-size="18" text-anchor="middle" dominant-baseline="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round" x="400" y="455" fill="black">导入</text><text font-family="SimSun, serif" font-size="18" text-anchor="middle" dominant-baseline="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round" x="660" y="455" fill="black">删除</text><text font-family="SimSun, serif" font-size="18" text-anchor="middle" dominant-baseline="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round" x="920" y="455" fill="black">盘点 / 调拨</text></svg>