coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: 96%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 96%
        threshold: 0%
        informational: false

# Both reports belong to one commit; do not report a completed status after only one upload.
codecov:
  notify:
    after_n_builds: 2
