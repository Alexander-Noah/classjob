spring.application.name=smart-lab-modular-host
spring.config.import=optional:file:.local-dev-secrets.properties
spring.datasource.url=${SMART_LAB_DB_URL}
spring.datasource.username=${SMART_LAB_DB_USERNAME}
spring.datasource.password=${SMART_LAB_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
