name: CI

on:
  push:
    branches-ignore: [coverage-badges]
  pull_request:
  workflow_dispatch:

# 默认只读；只有 main 成功后的徽章发布任务授予内容写权限。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Backend
    services:
      mysql:
        image: mysql:8.4
        env:
          # 仅供临时 CI 容器使用，与应用配置及生产凭据无关。
          MYSQL_ROOT_PASSWORD: ci-disposable-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-disposable-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Backend/pom.xml
      - name: Test, package and enforce 96% line coverage
        run: >-
          mvn --batch-mode --no-transfer-progress -Pcoverage verify
          -Dreservation.mysql.it=true
          -Dreservation.mysql.url=jdbc:mysql://127.0.0.1:3306/
          -Dreservation.mysql.password=ci-disposable-password
          -Dcore.schema.mysql.it=true
          -Dcore.schema.mysql.url=jdbc:mysql://127.0.0.1:3306/
          -Dcore.schema.mysql.password=ci-disposable-password
      - name: Summarize coverage
        if: ${{ always() && !cancelled() }}
        working-directory: .
        run: python3 .github/scripts/coverage-summary.py backend
      - name: Upload backend test reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            Backend/target/surefire-reports/
            Backend/target/site/jacoco/
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Web tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production bundle
        run: npm run build
      - name: Test and enforce 96% line coverage
        run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=coverage/junit.xml
      - name: Summarize coverage
        if: ${{ always() && !cancelled() }}
        working-directory: .
        run: python3 .github/scripts/coverage-summary.py frontend
      - name: Upload frontend test reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-reports
          path: web/coverage/
          if-no-files-found: error
          retention-days: 14

  codecov:
    name: Upload coverage to Codecov
    needs: [backend, frontend]
    # Fork PRs and Dependabot do not have access to GitHub OIDC credentials.
    if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: backend-test-reports
          path: Backend/target
      - uses: actions/download-artifact@v8
        with:
          name: frontend-test-reports
          path: web/coverage
      - name: Upload JaCoCo report
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: Backend/target/site/jacoco/jacoco.xml
          flags: backend
          name: backend-jacoco
          disable_search: true
          fail_ci_if_error: true
      - name: Upload Vitest report
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: web/coverage/lcov.info
          flags: frontend
          name: frontend-vitest
          disable_search: true
          fail_ci_if_error: true

  required:
    name: Required checks
    if: ${{ always() }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both jobs to pass
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: test "$BACKEND_RESULT" = success && test "$FRONTEND_RESULT" = success

  coverage_badge:
    name: Publish actual coverage badge
    needs: [backend, frontend]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: backend-test-reports
          path: Backend/target
      - uses: actions/download-artifact@v8
        with:
          name: frontend-test-reports
          path: web/coverage
      - name: Calculate combined source line coverage
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_coverage_badge.py'
          python3 .github/scripts/coverage-badge.py
      - name: Publish report to badge branch
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const branch = 'coverage-badges';
            const { owner, repo } = context.repo;
            // A queued older run must not overwrite a newer main result.
            const main = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (main.data.object.sha !== context.sha) {
              core.notice('main has advanced; leaving the latest badge unchanged.');
              return;
            }
            let parent;
            try {
              parent = (await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` })).data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const tree = await github.rest.git.createTree({ owner, repo,
              tree: ['coverage.json', 'report.json'].map(path => ({
                path, mode: '100644', type: 'blob',
                content: fs.readFileSync(`coverage-badge/${path}`, 'utf8'),
              })),
            });
            const commit = await github.rest.git.createCommit({ owner, repo,
              message: `Update coverage for ${context.sha}`, tree: tree.data.sha,
              parents: parent ? [parent] : [],
            });
            if (parent) {
              await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false });
            } else {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: commit.data.sha });
            }
